name: Android UI Tests

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        suite: [
          PaymentTests,
          CatalogPageTests,
          GuestCartTests,
          ReviewOrderTests,
          LoginTests,
          LogoutTests,
          ProductDetailsPageTests,
          GuestCheckoutFlowTests,
          OrderCompletePageTests,
          LoggedInUserCheckoutFlowTests,
          LoggedInUserCartTests,
          CheckoutTests,
          PaymentBillingTests
        ]
      max-parallel: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node & Appium
        run: |
          sudo apt-get update
          sudo apt-get install -y nodejs npm
          npm install -g appium
          appium driver install uiautomator2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-snapshot -noaudio -no-window -no-boot-anim
          disable-animations: true
          script: |
            nohup adb logcat > logcat.log 2>&1 &
            nohup appium > appium.log 2>&1 &
            sleep 35
            mvn -B -Dtest=${{ matrix.suite }} test

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.suite }}
          path: target/allure-results/

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.suite }}
          path: Reports/screenshots/

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.suite }}
          path: |
            appium.log
            logcat.log

  merge-reports:
    runs-on: ubuntu-latest
    needs: ui-tests
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all allure-results
        uses: actions/download-artifact@v4
        with:
          path: allure-results-all

      - name: Merge allure results
        run: |
          mkdir -p merged-allure-results
          find allure-results-all -name "*.json" -o -name "*.xml" -o -name "*.png" | \
            xargs -I {} cp {} merged-allure-results/ 2>/dev/null || true

      - name: Restore history from previous report
        run: |
          git clone --depth 1 --branch gh-pages \
            https://github.com/${{ github.repository }}.git gh-pages || true
          if [ -d "gh-pages/history" ]; then
            echo "Found previous history"
            mkdir -p merged-allure-results/history
            cp -r gh-pages/history/* merged-allure-results/history/
          else
            echo "No previous history found"
          fi

      - name: Add executor.json
        run: |
          cat <<EOF > merged-allure-results/executor.json
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "buildOrder": "${{ github.run_number }}",
            "buildName": "Run ${{ github.run_number }}",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportName": "Allure Report",
            "reportUrl": "https://iskrakrasimirova.github.io/AppiumSauceLabsAutomation/"
          }
          EOF

      - name: Add environment.properties
        run: |
          cat <<EOF > merged-allure-results/environment.properties
          Device=Pixel 7
          OS=Android 13
          API_Level=33
          Framework=Appium + JUnit5 (Java)
          Build=Maven
          Executor=GitHub Actions
          EOF

      - name: Install Allure CLI
        run: |
          curl -o allure.tgz -L https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -zxvf allure.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure

      - name: Generate combined Allure report
        run: allure generate merged-allure-results --clean -o allure-report

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages